  <line x1="32" y1="35" x2="62" y2="20" stroke="#2b180d" stroke-width="1" />
  <!-- Desk Cable Grommet Hole -->
  <ellipse cx="45" cy="14" rx="2" ry="1" fill="#2d180b" />
</svg>