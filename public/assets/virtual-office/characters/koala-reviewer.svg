  <ellipse cx="16" cy="42" rx="2.5" ry="2.5" fill="#94a3b8" />
  <ellipse cx="32" cy="42" rx="2.5" ry="2.5" fill="#94a3b8" />

  
    <!-- Cozy Winter Beret / Scholar Cap -->
